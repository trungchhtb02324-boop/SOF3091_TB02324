name: Selenium UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Restore dependencies
        run: dotnet restore src/SOF3091.Automation/SOF3091.Automation.csproj

      - name: Run Selenium tests
        env:
          Automation__Headless: "true"
        run: dotnet test src/SOF3091.Automation/SOF3091.Automation.csproj --configuration Release --logger "trx;LogFileName=selenium-results.trx"

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/Screenshots/**
          if-no-files-found: warn
